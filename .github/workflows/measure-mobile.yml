name: Production mobile Lighthouse retest
on:
  push:
    branches: [codex/mobile-performance-measurement]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix "$RUNNER_TEMP/lighthouse" lighthouse@13.6.0
      - name: Measure official domain in mobile emulation
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lh-results"
          export CHROME_PATH="$(command -v google-chrome)"
          for run in 1 2 3; do
            f="$RUNNER_TEMP/lh-results/production-$run.json"
            "$RUNNER_TEMP/lighthouse/node_modules/.bin/lighthouse" https://conversordeletrasbonitas.org/ --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --max-wait-for-load=35000 --output=json --output-path="$f" --quiet
            jq -c --arg run "$run" '{run:$run,url:.finalDisplayedUrl,error:.runtimeError,score:.categories.performance.score,fcp:.audits["first-contentful-paint"].numericValue,lcp:.audits["largest-contentful-paint"].numericValue,tbt:.audits["total-blocking-time"].numericValue,cls:.audits["cumulative-layout-shift"].numericValue}' "$f"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-mobile-retest
          path: ${{ runner.temp }}/lh-results
